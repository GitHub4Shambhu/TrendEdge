name: Backend Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal runtime deps for the test suite. torch / transformers /
          # xgboost are intentionally omitted: the transformer and GNN services
          # are torch-optional and fall back to deterministic NumPy paths, which
          # is exactly what these tests exercise. yfinance is replaced by a fake
          # injected in tests/conftest.py, so it is not installed either.
          pip install \
            numpy==1.26.4 \
            pandas==2.2.0 \
            scikit-learn==1.4.0 \
            pydantic==2.7.0 \
            pydantic-settings==2.2.0 \
            httpx==0.27.0 \
            pytest==8.2.0 \
            pytest-asyncio==0.23.8

      - name: Run backend tests
        run: pytest tests/ -v
